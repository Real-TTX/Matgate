name: Agent

# Builds the agent for every system and puts the programs into the rolling release "agent-latest", where
# Matgate's connection form links to them and Matgate itself reads the updates from:
#
# It is one program everywhere (agent/Matgate.Agent): the agent itself, its setup window and its icon in
# the notification area.
#
#   Windows          matgate-agent.exe         + matgate-agent.json
#   Linux, macOS     matgate-agent-<platform>  + matgate-agent-<platform>.json   (linux-x64, linux-arm64,
#                                                                                 osx-arm64, osx-x64)
#
# Every program of one run carries the same version (<VersionPrefix>.<run number>). Like MatMon's agent
# feed: the newest build from main is always at the same address.
on:
  push:
    branches:
      - main
    paths:
      - "agent/**"
      - "Matgate/Agent/AgentWire.cs"
      - "Matgate/Display/Video/OpenH264.cs"
      - ".github/workflows/agent.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: write

# One release, one writer at a time: two runs replacing the same assets at once (a push to main and its tag)
# left the release without its exe.
concurrency:
  group: agent-release
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows agent
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Compute version
        id: version
        shell: bash
        run: |
          base="$(sed -n 's/.*<VersionPrefix>\([^<]*\)<\/VersionPrefix>.*/\1/p' agent/Matgate.Agent/Matgate.Agent.csproj | head -n 1)"
          echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish
        shell: bash
        run: |
          dotnet publish agent/Matgate.Agent/Matgate.Agent.csproj -c Release -r win-x64 -o publish \
            -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.version }}
          ls -la publish
          sha256sum publish/matgate-agent.exe | cut -d' ' -f1 > publish/matgate-agent.exe.sha256
          # What Matgate reads to know the newest agent - uploaded after the exe, so it never names a file
          # that is not there yet.
          printf '{"version":"%s","sha256":"%s","size":%s,"commit":"%s"}'             "${{ steps.version.outputs.version }}" "$(cat publish/matgate-agent.exe.sha256)"             "$(stat -c%s publish/matgate-agent.exe)" "${GITHUB_SHA::7}" > publish/matgate-agent.json
          cat publish/matgate-agent.json

      - name: Smoke test
        shell: bash
        run: |
          ./publish/matgate-agent.exe --version
          ./publish/matgate-agent.exe setup --dry-run --port 7600
          # Every window, drawn without a screen.
          ./publish/matgate-agent.exe snapshot windows | cat
          ls windows | wc -l

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: matgate-agent-win-x64
          path: |
            publish/matgate-agent.exe
            publish/matgate-agent.exe.sha256
            publish/matgate-agent.json

  unix:
    name: Build ${{ matrix.rid }} agent
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # run: whether this runner can start the program it built (the smoke test).
          - { rid: linux-x64, os: ubuntu-latest, run: true }
          - { rid: linux-arm64, os: ubuntu-latest, run: false }
          - { rid: osx-arm64, os: macos-latest, run: true }
          - { rid: osx-x64, os: macos-latest, run: false }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Compute version
        id: version
        shell: bash
        run: |
          # The number is the Windows program's: one release, every system.
          base="$(sed -n 's/.*<VersionPrefix>\([^<]*\)<\/VersionPrefix>.*/\1/p' agent/Matgate.Agent/Matgate.Agent.csproj | head -n 1)"
          echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish
        shell: bash
        run: |
          dotnet publish agent/Matgate.Agent/Matgate.Agent.csproj -c Release -r ${{ matrix.rid }} -o out \
            -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.version }}
          mkdir -p publish
          cp out/matgate-agent publish/matgate-agent-${{ matrix.rid }}
          chmod +x publish/matgate-agent-${{ matrix.rid }}
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Apple's ARM machines start nothing that is not signed; a signature without an identity is enough.
            codesign --force --sign - publish/matgate-agent-${{ matrix.rid }}
          fi
          hash="$(shasum -a 256 publish/matgate-agent-${{ matrix.rid }} | cut -d' ' -f1)"
          size="$(wc -c < publish/matgate-agent-${{ matrix.rid }} | tr -d ' ')"
          printf '{"version":"%s","sha256":"%s","size":%s,"commit":"%s","platform":"%s"}' \
            "${{ steps.version.outputs.version }}" "$hash" "$size" "${GITHUB_SHA::7}" "${{ matrix.rid }}" > publish/matgate-agent-${{ matrix.rid }}.json
          ls -la publish
          cat publish/matgate-agent-${{ matrix.rid }}.json

      - name: Smoke test
        if: matrix.run
        shell: bash
        run: |
          ./publish/matgate-agent-${{ matrix.rid }} --version
          ./publish/matgate-agent-${{ matrix.rid }} setup --dry-run --port 7600
          # Every window, drawn without a screen: the setup and the tray's windows come up on this system.
          ./publish/matgate-agent-${{ matrix.rid }} snapshot windows
          ls windows | wc -l

      # The screen for real: an X server on the runner, and the agent's own probe finds it, captures a
      # picture and encodes it with the distribution's OpenH264.
      - name: Screen probe (Linux)
        if: matrix.run && runner.os == 'Linux'
        timeout-minutes: 5
        continue-on-error: true
        shell: bash
        run: |
          note() { local text="$2"; text="${text//'%'/%25}"; text="${text//$'\r'/}"; text="${text//$'\n'/%0A}"; echo "::notice title=$1::$text"; }
          sudo apt-get update -qq
          # OpenH264 is libopenh264-7 or -8, depending on the runner's Ubuntu.
          for package in xvfb libx11-6 libxext6 libxfixes3 libxtst6 libxdamage1 libxrandr2 libopenh264-8 libopenh264-7; do
            sudo apt-get install -y -qq "$package" >/dev/null 2>&1 || echo "not installed: $package"
          done
          Xvfb :9 -screen 0 1280x800x24 -nolisten tcp &
          sleep 2
          out="$(DISPLAY=:9 ./publish/matgate-agent-${{ matrix.rid }} screen-probe 2>&1; echo "exit $?")"; echo "$out"
          note "screen-probe on $(lsb_release -ds)" "$out"
          echo "$out" | grep -q "^exit 0$"

      # A Mac's screen cannot be tried anywhere else: the probe runs as the runner's user and - the way the
      # system's service starts its helper - from a LaunchDaemon into the session of whoever is signed in.
      # What it says is kept as a notice of this run. It never fails the build: a runner may not allow it
      # (macOS gives the permission to record the screen to a program a person named, not to this one).
      - name: Screen probe (macOS)
        if: matrix.run && runner.os == 'macOS'
        timeout-minutes: 6
        continue-on-error: true
        shell: bash
        run: |
          agent="$PWD/publish/matgate-agent-${{ matrix.rid }}"
          note() { local text="$2"; text="${text//'%'/%25}"; text="${text//$'\r'/}"; text="${text//$'\n'/%0A}"; echo "::notice title=$1::$text"; }
          limited() { perl -e 'alarm 60; exec @ARGV' "$@"; }
          out="$(limited "$agent" screen-probe 2>&1; echo "exit $?")"; echo "$out"
          note "screen-probe as $(whoami) on macOS $(sw_vers -productVersion)" "$out"
          user="$(id -u)"
          printf '%s\n' '#!/bin/sh' \
            "/bin/launchctl asuser $user '$agent' screen-probe > /tmp/probe-root.txt 2>&1; echo \"exit \$?\" >> /tmp/probe-root.txt" \
            "/bin/launchctl asuser $user /usr/bin/sudo -u '#$user' '$agent' screen-probe > /tmp/probe-user.txt 2>&1; echo \"exit \$?\" >> /tmp/probe-user.txt" \
            "touch /tmp/probe-done" > /tmp/probe.sh
          chmod +x /tmp/probe.sh
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<plist version="1.0"><dict>' \
            '<key>Label</key><string>com.matgate.probe</string>' \
            '<key>ProgramArguments</key><array><string>/bin/sh</string><string>/tmp/probe.sh</string></array>' \
            '<key>RunAtLoad</key><true/>' '</dict></plist>' | sudo tee /Library/LaunchDaemons/com.matgate.probe.plist >/dev/null
          sudo launchctl bootstrap system /Library/LaunchDaemons/com.matgate.probe.plist
          for i in $(seq 1 90); do [ -f /tmp/probe-done ] && break; sleep 2; done
          note "from a LaunchDaemon: launchctl asuser, as root" "$(cat /tmp/probe-root.txt 2>&1)"
          note "from a LaunchDaemon: launchctl asuser, as the user" "$(cat /tmp/probe-user.txt 2>&1)"

      - name: Upload the pictures of the windows
        if: matrix.run
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.rid }}
          path: windows/*.png

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: matgate-agent-${{ matrix.rid }}
          path: publish/*

  release:
    name: Rolling release agent-latest
    # Only main fills the rolling release; a tag build is the same code and would race it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, unix]
    runs-on: ubuntu-latest

    steps:
      - name: Download the programs
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la release
          version="$(sed -n 's/.*"version":"\([^"]*\)".*/\1/p' release/matgate-agent.json)"
          gh release view agent-latest >/dev/null 2>&1 || \
            gh release create agent-latest --title "Matgate agent (latest)" --prerelease \
              --notes "The newest agent from main."
          # The programs first, then what names them: a manifest never points at a file that is not there yet.
          gh release upload agent-latest release/matgate-agent.exe release/matgate-agent.exe.sha256 --clobber
          for program in release/matgate-agent-linux-x64 release/matgate-agent-linux-arm64 release/matgate-agent-osx-arm64 release/matgate-agent-osx-x64; do
            gh release upload agent-latest "$program" --clobber
          done
          gh release upload agent-latest release/*.json --clobber
          gh release edit agent-latest --notes "Matgate agent ${version} (${GITHUB_SHA::7}).

          **Windows:** download matgate-agent.exe, double-click it and press Install. Uninstall: Settings > Apps > Installed apps > Matgate Agent.

          **Linux and macOS** (files and terminals, as the system's service): download the program for the machine (matgate-agent-linux-x64, -linux-arm64, -osx-arm64, -osx-x64), then \`chmod +x matgate-agent-* && sudo ./matgate-agent-* setup\`. Uninstall: \`sudo matgate-agent uninstall\` (the program is in /opt/matgate-agent, on macOS in /usr/local/lib/matgate-agent)."
