name: Agent

# Builds the Windows agent (one self-contained matgate-agent.exe: setup, uninstall and the agent
# itself) and puts it into the rolling release "agent-latest", where Matgate's connection form links
# to it. Like MatMon's agent feed: the newest build from main is always at the same address.
on:
  push:
    branches:
      - main
    paths:
      - "agent/**"
      - "Matgate/Agent/AgentWire.cs"
      - ".github/workflows/agent.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: write

# One release, one writer at a time: two runs replacing the same assets at once (a push to main and its tag)
# left the release without its exe.
concurrency:
  group: agent-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows agent
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Compute version
        id: version
        shell: bash
        run: |
          base="$(sed -n 's/.*<VersionPrefix>\([^<]*\)<\/VersionPrefix>.*/\1/p' agent/Matgate.Agent/Matgate.Agent.csproj | head -n 1)"
          echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish
        shell: bash
        run: |
          dotnet publish agent/Matgate.Agent/Matgate.Agent.csproj -c Release -r win-x64 -o publish \
            -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.version }}
          ls -la publish
          sha256sum publish/matgate-agent.exe | cut -d' ' -f1 > publish/matgate-agent.exe.sha256
          # What Matgate reads to know the newest agent - uploaded after the exe, so it never names a file
          # that is not there yet.
          printf '{"version":"%s","sha256":"%s","size":%s,"commit":"%s"}'             "${{ steps.version.outputs.version }}" "$(cat publish/matgate-agent.exe.sha256)"             "$(stat -c%s publish/matgate-agent.exe)" "${GITHUB_SHA::7}" > publish/matgate-agent.json
          cat publish/matgate-agent.json

      - name: Smoke test
        shell: bash
        run: |
          ./publish/matgate-agent.exe --version
          ./publish/matgate-agent.exe setup --dry-run --port 7600

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: matgate-agent-win-x64
          path: publish/matgate-agent.exe*

      - name: Rolling release agent-latest
        # Only main fills the rolling release; a tag build is the same code and would race it.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view agent-latest >/dev/null 2>&1 || \
            gh release create agent-latest --title "Matgate agent (latest)" --prerelease \
              --notes "The newest Windows agent from main. Download matgate-agent.exe, double-click it and press Install."
          gh release upload agent-latest publish/matgate-agent.exe publish/matgate-agent.exe.sha256 --clobber
          gh release upload agent-latest publish/matgate-agent.json --clobber
          gh release edit agent-latest --notes "Matgate agent ${{ steps.version.outputs.version }} (${GITHUB_SHA::7}). Download matgate-agent.exe, double-click it and press Install. Uninstall: Settings > Apps > Installed apps > Matgate Agent."
