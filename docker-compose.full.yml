# Matgate with everything: the options of docker-compose.yml plus the browser farm, which lets a
# website be opened inside a throwaway Chromium or Firefox instead of through the reverse proxy.
#
#   docker compose -f docker-compose.full.yml up -d
#
# Options are set through a .env file - copy .env.example if you need any; without one the defaults
# below apply. The farm needs no configuration and no token: it has no host ports and is reachable
# only from Matgate.
name: matgate

# Your DNS, so connections can use short names from your network.
x-home-dns: &home-dns
  dns:
    - ${MATGATE_DNS_SERVER:-10.10.0.1}
  dns_search:
    - ${MATGATE_DNS_SEARCH:-Schmoldt.local}

services:
  # The single entrance on 8088, and what keeps Guacamole behind the Matgate login: it is reachable
  # only through here, and only after Matgate has confirmed the session.
  edge:
    <<: *home-dns
    image: caddy:2
    depends_on: [matgate, guacamole]
    ports:
      - "8088:8088"
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf "%s\n" \
          ":8088 {" \
          "  encode zstd gzip" \
          "  handle /guacamole* {" \
          "    forward_auth matgate:8080 {" \
          "      uri /internal/guac-authz" \
          "    }" \
          "    reverse_proxy guacamole:8080" \
          "  }" \
          "  handle {" \
          "    reverse_proxy matgate:8080" \
          "  }" \
          "}" > /tmp/Caddyfile && exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    restart: unless-stopped

  matgate:
    <<: *home-dns
    image: ghcr.io/real-ttx/matgate:latest
    environment:
      # Turns the browser farm on. Without it, websites are only offered in "native" mode.
      BrowserFarm__BaseUrl: http://browser-farm:8090
      # Leave the admin values empty and the first start asks you to create the account. Set them to
      # skip that, for an install that has to come up unattended.
      MATGATE_ADMIN_USER: ${MATGATE_ADMIN_USER:-}
      MATGATE_ADMIN_PASSWORD: ${MATGATE_ADMIN_PASSWORD:-}
      MATGATE_ADMIN_EMAIL: ${MATGATE_ADMIN_EMAIL:-}
      # Turn on once TLS is terminated in front of Matgate: secure-only cookies, HSTS, redirect.
      MATGATE_REQUIRE_HTTPS: ${MATGATE_REQUIRE_HTTPS:-false}
      # Keys: set them to pin your own, otherwise Matgate generates them on first start and keeps
      # them in the matgate-secrets volume. The at-rest key lives there rather than in ./data, so a
      # stolen data backup alone cannot decrypt stored device passwords.
      Guacamole__JsonSecretKey: ${MATGATE_GUACAMOLE_JSON_SECRET_KEY:-}
      MATGATE_SECRET_KEY: ${MATGATE_SECRET_KEY:-}
      MATGATE_GUACAMOLE_JSON_SECRET_KEY_FILE: /run/matgate-secrets/guac.key
      MATGATE_SECRET_KEY_FILE: /run/matgate-secrets/master.key
    volumes:
      - ./data:/data
      - matgate-files:/files
      - matgate-secrets:/run/matgate-secrets
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Guacamole waits for the shared key, which Matgate writes on first start.
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/matgate-secrets/guac.key"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  guacd:
    <<: *home-dns
    image: guacamole/guacd:1.6.0
    # The same tree as Matgate, at the same path: a session's drive is one folder in here, and the
    # links inside it have to resolve to the same place in both containers.
    volumes:
      - matgate-files:/files
    restart: unless-stopped

  guacamole:
    image: guacamole/guacamole:1.6.0
    depends_on:
      guacd: { condition: service_started }
      matgate: { condition: service_healthy }
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
      JSON_ENABLED: "true"
    entrypoint:
      - /bin/sh
      - -c
      - export JSON_SECRET_KEY="$$(cat /run/matgate-secrets/guac.key)"; exec /opt/guacamole/bin/entrypoint.sh
    volumes:
      - ./data:/etc/guacamole
      - matgate-secrets:/run/matgate-secrets:ro
    restart: unless-stopped

  # A pool of isolated browser slots, each its own Linux user with its own Xvfb and VNC. No host
  # ports and no Docker socket. `init: true` matters: without a reaper the browsers leave zombies.
  browser-farm:
    <<: *home-dns
    image: ghcr.io/real-ttx/matgate-browser-farm:latest
    init: true
    restart: unless-stopped

volumes:
  # The encryption keys. Back this up - without it, stored device passwords cannot be decrypted.
  matgate-secrets:
  # Files exchanged with sessions. Point it at a path of your own to keep them elsewhere.
  matgate-files:
