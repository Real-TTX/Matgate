# Matgate - full stack INCLUDING the browser farm (the "via Chromium / Firefox VNC" website mode).
# Ready to use with the prebuilt images:  docker compose -f docker-compose.browser.yml up -d
# Open http://localhost:8088  (first start shows the setup wizard).
# The browser farm is a pool of isolated Chromium/Firefox sessions streamed over VNC; it needs no
# host ports and no auth (internal-only). Pool size / resolution are configurable in
# Administration -> Browser.
name: matgate

services:
  edge:
    image: caddy:2
    depends_on: [matgate, guacamole]
    ports:
      - "8088:8088"
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf "%s\n" \
          ":8088 {" \
          "  encode zstd gzip" \
          "  handle /guacamole* {" \
          "    forward_auth matgate:8080 {" \
          "      uri /internal/guac-authz" \
          "    }" \
          "    reverse_proxy guacamole:8080" \
          "  }" \
          "  handle {" \
          "    reverse_proxy matgate:8080" \
          "  }" \
          "}" > /tmp/Caddyfile && exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    restart: unless-stopped

  matgate:
    image: ghcr.io/real-ttx/matgate:latest
    environment:
      ASPNETCORE_URLS: http://+:8080
      MATGATE_DATA_DIR: /data
      Guacamole__PublicBasePath: /guacamole
      Guacamole__DirectLaunch: "true"
      MATGATE_ADMIN_USER: ${MATGATE_ADMIN_USER:-}
      MATGATE_ADMIN_PASSWORD: ${MATGATE_ADMIN_PASSWORD:-}
      MATGATE_ADMIN_EMAIL: ${MATGATE_ADMIN_EMAIL:-}
      Guacamole__JsonSecretKey: ${MATGATE_GUACAMOLE_JSON_SECRET_KEY:-}
      MATGATE_GUACAMOLE_JSON_SECRET_KEY_FILE: /run/matgate-secrets/guac.key
      MATGATE_SECRET_KEY: ${MATGATE_SECRET_KEY:-}
      MATGATE_SECRET_KEY_FILE: /run/matgate-secrets/master.key
      # Point Matgate at the browser farm below.
      BrowserFarm__BaseUrl: http://browser-farm:8090
      BrowserFarm__VncHost: browser-farm
    volumes:
      - ./data:/data
      - matgate-secrets:/run/matgate-secrets
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/matgate-secrets/guac.key"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  guacd:
    image: guacamole/guacd:1.6.0
    volumes:
      - ./data/guac-drives:/drive
    restart: unless-stopped

  guacamole:
    image: guacamole/guacamole:1.6.0
    depends_on:
      guacd:
        condition: service_started
      matgate:
        condition: service_healthy
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
      JSON_ENABLED: "true"
      JSON_SECRET_KEY: ${MATGATE_GUACAMOLE_JSON_SECRET_KEY:-}
    entrypoint:
      - /bin/sh
      - -c
      - export JSON_SECRET_KEY="$${JSON_SECRET_KEY:-$$(cat /run/matgate-secrets/guac.key)}"; exec /opt/guacamole/bin/entrypoint.sh
    volumes:
      - ./data:/etc/guacamole
      - matgate-secrets:/run/matgate-secrets:ro
    restart: unless-stopped

  browser-farm:
    image: ghcr.io/real-ttx/matgate-browser-farm:latest
    init: true
    environment:
      FARM_POOL_SIZE: ${MATGATE_BROWSER_FARM_POOL_SIZE:-10}
      FARM_GEOMETRY: ${MATGATE_BROWSER_FARM_GEOMETRY:-1280x800x24}
    restart: unless-stopped

volumes:
  matgate-secrets:
