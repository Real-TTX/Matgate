name: matgate

x-home-dns: &home-dns
  dns:
    - ${MATGATE_DNS_SERVER:-10.10.0.1}
  dns_search:
    - ${MATGATE_DNS_SEARCH:-Schmoldt.local}

services:
  edge:
    <<: *home-dns
    image: caddy:2
    depends_on:
      - matgate
      - guacamole
    ports:
      - "8088:8088"
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf "%s\n" \
          ":8088 {" \
          "  encode zstd gzip" \
          "  handle /guacamole* {" \
          "    forward_auth matgate:8080 {" \
          "      uri /internal/guac-authz" \
          "    }" \
          "    reverse_proxy guacamole:8080" \
          "  }" \
          "  handle {" \
          "    reverse_proxy matgate:8080" \
          "  }" \
          "}" > /tmp/Caddyfile && \
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    restart: unless-stopped

  matgate:
    <<: *home-dns
    build:
      context: .
      dockerfile: Matgate/Dockerfile
      args:
        MATGATE_VERSION_SUFFIX: ${MATGATE_VERSION_SUFFIX:-}
    environment:
      ASPNETCORE_URLS: http://+:8080
      MATGATE_DATA_DIR: /data
      # Leave these EMPTY (default) for the first-run setup wizard: on a fresh install the web UI
      # asks for username, email and password of the admin account. Set them explicitly (via .env)
      # only for unattended/automated deployments - then the admin is seeded from the environment
      # and the wizard is skipped.
      MATGATE_ADMIN_USER: ${MATGATE_ADMIN_USER:-}
      MATGATE_ADMIN_PASSWORD: ${MATGATE_ADMIN_PASSWORD:-}
      MATGATE_ADMIN_EMAIL: ${MATGATE_ADMIN_EMAIL:-}
      MATGATE_REQUIRE_HTTPS: ${MATGATE_REQUIRE_HTTPS:-false}
      # Secrets: an explicit .env value wins; otherwise matgate itself generates the key on first
      # start and writes it into the shared secrets volume (see MATGATE_*_FILE below). The at-rest key
      # (master.key) lives OUTSIDE ./data so a stolen ./data backup can't decrypt stored device
      # credentials - keep the `matgate-secrets` volume backed up.
      Guacamole__JsonSecretKey: ${MATGATE_GUACAMOLE_JSON_SECRET_KEY:-}
      MATGATE_GUACAMOLE_JSON_SECRET_KEY_FILE: /run/matgate-secrets/guac.key
      MATGATE_SECRET_KEY: ${MATGATE_SECRET_KEY:-}
      MATGATE_SECRET_KEY_FILE: /run/matgate-secrets/master.key
      Guacamole__PublicBasePath: /guacamole
      Guacamole__DirectLaunch: "true"
      # Optional "via Chromium/Firefox VNC" websites: point Matgate at the browser-farm sidecar.
      # If the farm profile is not started, these do nothing and only "Native" websites are offered.
      # No auth token is needed - the farm is internal-only (no host ports). Set
      # MATGATE_BROWSER_FARM_TOKEN on both services if you want to require the shared token anyway.
      BrowserFarm__BaseUrl: ${MATGATE_BROWSER_FARM_URL:-http://browser-farm:8090}
      BrowserFarm__VncHost: ${MATGATE_BROWSER_FARM_VNC_HOST:-browser-farm}
      MATGATE_BROWSER_FARM_TOKEN: ${MATGATE_BROWSER_FARM_TOKEN:-}
    volumes:
      - ./data:/data
      - matgate-secrets:/run/matgate-secrets
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # matgate writes the shared Guacamole key on first start; guacamole waits for this to go healthy.
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/matgate-secrets/guac.key"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 2s
    restart: unless-stopped

  guacd:
    <<: *home-dns
    image: guacamole/guacd:1.6.0
    volumes:
      - ./data/guac-drives:/drive
    restart: unless-stopped

  guacamole:
    <<: *home-dns
    image: guacamole/guacamole:1.6.0
    depends_on:
      guacd:
        condition: service_started
      matgate:
        condition: service_healthy
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
      JSON_ENABLED: "true"
      # Optional .env override; empty falls back to the auto-generated shared key (see command below).
      JSON_SECRET_KEY: ${MATGATE_GUACAMOLE_JSON_SECRET_KEY:-}
    # Load the shared JSON secret (from .env or the auto-generated file) into the env the Guacamole
    # webapp reads at startup, then run its normal entrypoint. $$ keeps the shell expansion out of
    # Compose's own variable substitution.
    entrypoint:
      - /bin/sh
      - -c
      - export JSON_SECRET_KEY="$${JSON_SECRET_KEY:-$$(cat /run/matgate-secrets/guac.key)}"; exec /opt/guacamole/bin/entrypoint.sh
    volumes:
      - ./data:/etc/guacamole
      - matgate-secrets:/run/matgate-secrets:ro
      # Raise Tomcat's maxHttpHeaderSize (stock default 8 KB). Cookies are scoped by host, NOT port,
      # so every other service running on `localhost:*` also sends its cookies to `localhost:8088`.
      # On a busy host the combined Cookie header on /guacamole/api/tokens can exceed 8 KB, which
      # makes Tomcat reject the request ("Request header is too large") and the Matgate client report
      # "Guacamole rejected the start token". This is a copy of the image's server.xml with only
      # maxHttpHeaderSize="65536" added to the 8080 connector (pinned to guacamole/guacamole:1.6.0).
      - ./guacamole/server.xml:/usr/local/tomcat/conf/server.xml:ro
    restart: unless-stopped

  # OPTIONAL sidecar: a pool of isolated Chromium/Firefox sessions (each on its own VNC port) for
  # "via Chromium VNC" / "via Firefox VNC" websites - a fallback for pages the native reverse proxy
  # can't render. Start it with:  docker compose --profile browser up -d
  # Without this profile Matgate simply offers "Native" websites only.
  browser-farm:
    <<: *home-dns
    # Pull the prebuilt image, or build locally with:  docker compose --profile browser up -d --build
    image: ghcr.io/real-ttx/matgate-browser-farm:latest
    build:
      context: ./browser-farm
    profiles: ["browser"]
    init: true
    environment:
      # Initial pool size / resolution. Both are also live-configurable in Administration -> Browser.
      FARM_POOL_SIZE: ${MATGATE_BROWSER_FARM_POOL_SIZE:-10}
      FARM_GEOMETRY: ${MATGATE_BROWSER_FARM_GEOMETRY:-1280x800x24}
      # No auth by default (internal-only). To require the shared token, set MATGATE_BROWSER_FARM_TOKEN
      # here and on matgate.
      FARM_TOKEN: ${MATGATE_BROWSER_FARM_TOKEN:-}
    # guacd reaches the VNC ports (5901+) over the internal network; no host ports needed.
    restart: unless-stopped

volumes:
  matgate-secrets:
