name: matgate

x-home-dns: &home-dns
  dns:
    - ${MATGATE_DNS_SERVER:-10.10.0.1}
  dns_search:
    - ${MATGATE_DNS_SEARCH:-Schmoldt.local}

services:
  # One-time init: auto-generates strong secrets into a named volume so a plain `docker compose up`
  # just works - no .env required. You can still override either value via .env (see below).
  secrets:
    image: alpine:3
    volumes:
      - matgate-secrets:/secrets
    command:
      - /bin/sh
      - -c
      - |
        set -e
        if [ ! -s /secrets/guac.key ]; then
          od -An -tx1 -N16 /dev/urandom | tr -d ' \n\r' > /secrets/guac.key
        fi
        if [ ! -s /secrets/master.key ]; then
          od -An -tx1 -N32 /dev/urandom | tr -d ' \n\r' > /secrets/master.key
        fi
        echo "Matgate secrets ready."
    restart: "no"

  edge:
    <<: *home-dns
    image: caddy:2
    depends_on:
      - matgate
      - guacamole
    ports:
      - "8088:8088"
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf "%s\n" \
          ":8088 {" \
          "  encode zstd gzip" \
          "  handle /guacamole* {" \
          "    forward_auth matgate:8080 {" \
          "      uri /internal/guac-authz" \
          "    }" \
          "    reverse_proxy guacamole:8080" \
          "  }" \
          "  handle {" \
          "    reverse_proxy matgate:8080" \
          "  }" \
          "}" > /tmp/Caddyfile && \
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    restart: unless-stopped

  matgate:
    <<: *home-dns
    build:
      context: .
      dockerfile: Matgate/Dockerfile
      args:
        MATGATE_VERSION_SUFFIX: ${MATGATE_VERSION_SUFFIX:-}
    depends_on:
      secrets:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_URLS: http://+:8080
      MATGATE_DATA_DIR: /data
      MATGATE_ADMIN_USER: ${MATGATE_ADMIN_USER:-admin}
      MATGATE_ADMIN_PASSWORD: ${MATGATE_ADMIN_PASSWORD:-change-me-now}
      MATGATE_REQUIRE_HTTPS: ${MATGATE_REQUIRE_HTTPS:-false}
      # Secrets: an explicit .env value wins; otherwise the auto-generated file in the secrets volume
      # is used. The at-rest key (master.key) lives OUTSIDE ./data so a stolen ./data backup can't
      # decrypt stored device credentials - keep the `matgate-secrets` volume backed up.
      Guacamole__JsonSecretKey: ${MATGATE_GUACAMOLE_JSON_SECRET_KEY:-}
      MATGATE_GUACAMOLE_JSON_SECRET_KEY_FILE: /run/matgate-secrets/guac.key
      MATGATE_SECRET_KEY: ${MATGATE_SECRET_KEY:-}
      MATGATE_SECRET_KEY_FILE: /run/matgate-secrets/master.key
      Guacamole__PublicBasePath: /guacamole
      Guacamole__DirectLaunch: "true"
    volumes:
      - ./data:/data
      - matgate-secrets:/run/matgate-secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  guacd:
    <<: *home-dns
    image: guacamole/guacd:1.6.0
    volumes:
      - ./data/guac-drives:/drive
    restart: unless-stopped

  guacamole:
    <<: *home-dns
    image: guacamole/guacamole:1.6.0
    depends_on:
      guacd:
        condition: service_started
      secrets:
        condition: service_completed_successfully
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
      JSON_ENABLED: "true"
      # Optional .env override; empty falls back to the auto-generated shared key (see command below).
      JSON_SECRET_KEY: ${MATGATE_GUACAMOLE_JSON_SECRET_KEY:-}
    # Load the shared JSON secret (from .env or the auto-generated file) into the env the Guacamole
    # webapp reads at startup, then run its normal entrypoint. $$ keeps the shell expansion out of
    # Compose's own variable substitution.
    entrypoint:
      - /bin/sh
      - -c
      - export JSON_SECRET_KEY="$${JSON_SECRET_KEY:-$$(cat /run/matgate-secrets/guac.key)}"; exec /opt/guacamole/bin/entrypoint.sh
    volumes:
      - ./data:/etc/guacamole
      - matgate-secrets:/run/matgate-secrets:ro
    restart: unless-stopped

volumes:
  matgate-secrets:
