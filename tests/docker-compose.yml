# The stack the UI tests run against: a complete Matgate behind the same edge proxy as in
# production, with both ways to open remote sessions (its own engine and Guacamole), plus an SSH
# host and a Linux desktop (RDP, VNC) to connect to. Separate from the development stack on
# purpose - the tests create and delete users, places and shares, and they must not do that in
# anything anyone is working in.
#
#   docker compose -f tests/docker-compose.yml up -d --build
#   node tests/run-all.js
#
# Everything in here is test data: the credentials below exist only inside this stack, which
# publishes a single port on localhost.
name: matgate-tests
services:
  edge:
    image: caddy:2
    depends_on: [matgate, guacamole]
    ports: ["18091:8088"]
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf "%s\n" \
          ":8088 {" \
          "  encode zstd gzip" \
          "  handle /guacamole* {" \
          "    forward_auth matgate:8080 {" \
          "      uri /internal/guac-authz" \
          "    }" \
          "    reverse_proxy guacamole:8080" \
          "  }" \
          "  handle {" \
          "    reverse_proxy matgate:8080" \
          "  }" \
          "}" > /tmp/Caddyfile && exec caddy run --config /tmp/Caddyfile --adapter caddyfile
  matgate:
    build:
      context: ..
      dockerfile: Matgate/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      MATGATE_DATA_DIR: /data
      MATGATE_ADMIN_USER: admin
      MATGATE_ADMIN_PASSWORD: test-only-pw
      MATGATE_ADMIN_EMAIL: admin@example.invalid
      # tests/agent-update.js serves its own agent releases (instead of GitHub) on the host.
      MATGATE_AGENT_UPDATE_URL: http://host.docker.internal:17499/
      MATGATE_AGENT_UPDATE_CACHE_SECONDS: "0"
      # tests/kept-sessions.js: a session without a browser runs out after seconds, not minutes.
      MATGATE_KEEP_SESSION_SECONDS: "12"
      # tests/website.js: websites get host names of their own. *.localhost is this machine in every
      # browser, and <label>.mg.localhost is the same site as mg.localhost - which is where that test
      # opens Matgate (a frame keeps its cookies only within one site).
      MATGATE_WEBSITE_HOST: "*.mg.localhost"
    volumes: [mgdata:/data, secrets:/run/matgate-secrets, files:/files]
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/matgate-secrets/guac.key"]
      interval: 3s
      timeout: 3s
      retries: 30
  # The same Matgate as nobody has set it up for websites: no host names of their own, so a website opens
  # under a path of Matgate's address (tests/browser-under-path.js). Reached directly, on a port of its own.
  matgate-plain:
    build:
      context: ..
      dockerfile: Matgate/Dockerfile
    ports: ["127.0.0.1:18092:8080"]
    environment:
      ASPNETCORE_URLS: http://+:8080
      MATGATE_DATA_DIR: /data
      MATGATE_ADMIN_USER: admin
      MATGATE_ADMIN_PASSWORD: test-only-pw
      MATGATE_ADMIN_EMAIL: admin@example.invalid
    volumes: [mgdata-plain:/data, secrets-plain:/run/matgate-secrets]
  guacd:
    environment:
      GUACD_LOG_LEVEL: debug
    image: guacamole/guacd:1.6.0
  guacamole:
    image: guacamole/guacamole:1.6.0
    depends_on:
      guacd: { condition: service_started }
      matgate: { condition: service_healthy }
    environment:
      GUACD_HOSTNAME: guacd
      JSON_ENABLED: "true"
      JSON_SECRET_KEY_FILE: /run/matgate-secrets/guac.key
      WEBAPP_CONTEXT: guacamole
    volumes: [secrets:/run/matgate-secrets:ro]
  # A Linux desktop with RDP (3389) and VNC (5901) to connect to. FUSE lets xrdp take files from the
  # clipboard.
  desktop:
    build: ./desktop
    devices: ["/dev/fuse"]
    cap_add: [SYS_ADMIN]
    security_opt: ["apparmor:unconfined"]
  ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      USER_NAME: demo
      USER_PASSWORD: demo-only-pw
      PASSWORD_ACCESS: "true"
      SUDO_ACCESS: "false"
  # An SSH server that lets in only by key (tests/ssh-key.js): the two test-only keys in tests/ssh-key, one of
  # them locked with a passphrase.
  ssh-key:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      USER_NAME: demo
      PASSWORD_ACCESS: "false"
      PUBLIC_KEY_DIR: /keys
      SUDO_ACCESS: "false"
    volumes: ["./ssh-key/pub:/keys:ro"]
  # A website to show through Matgate (tests/site/server.js): "site" and, as a second host name, "other".
  site:
    image: node:22-alpine
    command: ["node", "/site/server.js"]
    volumes: ["./site:/site:ro"]
    networks:
      default:
        aliases: [other]
  # A Linux machine with the Matgate agent on it (tests/agent-linux.js): built as the release is, running as
  # root with a user "demo" for the programs.
  agent-linux:
    build:
      context: ..
      dockerfile: tests/agent-linux/Dockerfile
    init: true
  # The tunnel (tests/tunnel.js): an agent with its tunnel on, standing in two networks - the stack's and one of
  # its own ("behind") with an SSH server Matgate cannot reach. It also connects to Matgate itself (MatgateUrl),
  # so it is reached without its port being reachable.
  agent-tunnel:
    build:
      context: ..
      dockerfile: tests/agent-linux/Dockerfile
    init: true
    entrypoint: ["/bin/sh", "-c", "while true; do /opt/matgate-agent/matgate-agent run --config /data/tunnel.json; sleep 1; done"]
    volumes: ["./agent-linux/tunnel-agent.json:/data/tunnel.json"]
    networks: [default, behind]
  hidden-ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      USER_NAME: demo
      USER_PASSWORD: demo-only-pw
      PASSWORD_ACCESS: "true"
      SUDO_ACCESS: "false"
    networks:
      behind:
        ipv4_address: 10.253.82.10
  # A WireGuard server in front of the same network (tests/tunnel.js): Matgate reaches hidden-ssh through it with
  # wireproxy. Only this test server needs NET_ADMIN - Matgate itself gets no rights for WireGuard.
  wg-server:
    image: lscr.io/linuxserver/wireguard:latest
    cap_add: [NET_ADMIN]
    sysctls: ["net.ipv4.conf.all.src_valid_mark=1"]
    environment:
      SERVERURL: wg-server
      SERVERPORT: "51820"
      PEERS: "1"
      PEERDNS: "none"
      INTERNAL_SUBNET: 10.13.13.0
      ALLOWEDIPS: 10.253.82.0/24
    networks: [default, behind]
  # Databases for the database browser (tests/database.js): one of each kind, with a small table to read.
  # SQL Server has no folder for scripts at its first start - the test makes its table itself.
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: demo, POSTGRES_PASSWORD: demo-only-pw, POSTGRES_DB: shop }
    volumes: ["./db/shop.sql:/docker-entrypoint-initdb.d/shop.sql:ro"]
  mariadb:
    image: mariadb:11
    environment: { MARIADB_USER: demo, MARIADB_PASSWORD: demo-only-pw, MARIADB_ROOT_PASSWORD: root-only-pw, MARIADB_DATABASE: shop }
    volumes: ["./db/shop.sql:/docker-entrypoint-initdb.d/shop.sql:ro"]
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "Demo-only-pw1", MSSQL_PID: Developer }
volumes: { mgdata: , secrets: , files: , mgdata-plain: , secrets-plain: }
# A fixed subnet, because Docker's default pools run out on a machine with many stacks
# ("all predefined address pools have been fully subnetted"). Change it if 10.253.81.0/24 is
# already taken here.
networks:
  default:
    ipam:
      config:
        - subnet: 10.253.81.0/24
  # Only the tunnel's agent and the machine behind it: Matgate is not in it.
  behind:
    ipam:
      config:
        - subnet: 10.253.82.0/24
